name: Validate Examples

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-examples:
    name: Build ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - clip-volt
          - hexa-grayscale
          - hexa-grayscale-vue
          - smart-clipper

    steps:
      - name: Checkout examples repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.example }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.example }}
        run: pnpm install --frozen-lockfile

      - name: Build example default target
        working-directory: ${{ matrix.example }}
        run: pnpm run build

      - name: Build example production target
        working-directory: ${{ matrix.example }}
        run: pnpm run production:chrome